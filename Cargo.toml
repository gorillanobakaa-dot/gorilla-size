[package]
name = "gorilla-size"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Gorilla Size Calculation: how big folders are, where the space went, what to do about it. Every core, no network, never a permanent delete."
repository = "https://github.com/gorillanobakaa-dot/gorilla-size"
readme = "README.md"
rust-version = "1.80"

# Every dependency is vendored (vendor/, checked in) and the build runs --offline --locked: after the one download
# that made vendor/, nobody can change what goes into the binary. Kept deliberately few. Windows APIs are declared
# by hand against kernel32 (always present), so no Windows crate and no prebuilt import library is needed.
[dependencies]
rayon = "1"
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
